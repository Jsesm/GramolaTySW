<div class="login-page">
    <h2>Iniciar Sesión</h2>
    <form class="form" (ngSubmit)="onLoginSubmit()">
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
        <p> {{errorMsg}}</p>
    </form>

    <button type="submit" (click)="soyuncliente()" class="btn-cliente">Soy cliente del bar</button>
    
    <div class="auth-link">
        <p>¿Eres el dueño de un bar y no tienes una cuenta? 
            <a (click)="goToRegister()">Regístrate aquí</a>
        </p>
    </div>
</div>


<div class="MensajeAdvertencia" *ngIf="nohaybares">
    <div class="nohaybares">
      <h2>Upssss, no hemos encontrado ningún bar cerca de ti... Pon la ubicación o coméntaselo al dueño del bar, esta canción corre de su cuenta</h2>
        <div class="botones">
          <button class="btn btn-entendido" (click)="entendido()">Entendido</button>
        </div>
    </div>
    
</div>
