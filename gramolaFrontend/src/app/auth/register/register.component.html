<div class="register-page">
    <h2>¡Registra ya tu Bar!</h2>
    <form (ngSubmit)="registrarse()">
        
        <div class="form-row">
            <div class="form-group">
                <label>Nombre bar:</label>
                <input type="text" [(ngModel)]="nombreBar" name="bar" required [ngClass]="{ 'form--error': nombreBar === '' }"/>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" [(ngModel)]="email" name="email" required />
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" [(ngModel)]="pwd1" name="password" required />
            </div>
            <div class="form-group">
                <label>Confirmar Contraseña:</label>
                <input type="password" [(ngModel)]="pwd2" name="confirmPassword" required />
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Precio canción (€):</label>
                <input type="number" [(ngModel)]="precioCancion" name="precioCancion" min="0" step="0.1" required/>
            </div>
            <div class="form-group">
                <label>Código Postal:</label>
                <input type="text" [(ngModel)]="codigoPostal" name="codigoPostal" required />
                <div class="checkbox-wrapper">
                    <input type="checkbox" [(ngModel)]="Ubireal" name="Ubireal" id="Ubireal" />
                    <label for="Ubireal">Quiero utilizar mi ubicación actual</label>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>ClientId:</label>
                <input type="text" [(ngModel)]="clientId" name="clientId" required />
            </div>
            <div class="form-group">
                <label>ClientSecret:</label>
                <input type="password" [(ngModel)]="clientSecret" name="clientSecret" required />
            </div>
        </div>

        <div class="registro">

            <button type="button" class="btn-secondary" [ngClass]="{ 'firma-ok': signatureDataUrl !== null }" (click)="toggleSignaturePad()">
                {{ signatureDataUrl ? 'Firma Guardada' : 'Añadir Firma Digital' }}
            </button>

            <div *ngIf="registroKO" class="error-container">
                {{ mensaje }}
            </div>

            <button type="submit" class="btn-primary">Registrar Bar</button>

        </div>
    </form>

    <div class="auth-link">
        <p>¿Tu bar ya está registrado o eres un cliente? 
            <a (click)="goToLogin()">Inicia sesión</a>
        </p>
    </div>
</div>

<div class="loading-overlay" *ngIf="registroOK">
    <div class="spinner"></div>
    <p>REGISTRANDO... Esto puede ir DES-PA-CITO</p>
</div>

<div class="signature-modal-overlay" *ngIf="isSignaturePadVisible">
    <div class="canvas-container">
        <h3>Haz una firma</h3>
        <canvas #canvas width="300" height="150" class="drawing-canvas"
            (mousedown)="startDrawing($event)" (mousemove)="draw($event)"
            (mouseup)="stopDrawing()" (mouseout)="stopDrawing()"></canvas>
        <div class="canvas-actions">
            <button type="button" (click)="clearCanvas()" class="btn-clear">Limpiar</button>
            <button type="button" (click)="saveSignature()" class="btn-success">Guardar</button> 
        </div>
    </div>
</div>
