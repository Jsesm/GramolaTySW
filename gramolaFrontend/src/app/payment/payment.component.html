<div id="payment-container">

<div id="prepay">
    <h2>MONEY, MONEY, MONTH</h2>

    <p>{{mensajeMensual}}</p>
    <button (click)="prepay('Cuenta')" [disabled]="isLoading || !stripeInitialized" 
            [class.loading]="isLoading">
        <span *ngIf="!isLoading">Quiero un mes</span>
        <div *ngIf="isLoading" class="spinner"></div>
    </button>
</div>

<div id="prepay">
    <h2>UN AÑO MÁS</h2>

    <p>{{mensajeAnual}}</p>
    <button (click)="prepay('Anual')" [disabled]="isLoading || !stripeInitialized" 
            [class.loading]="isLoading">
        <span *ngIf="!isLoading">Pagar un año</span>
        <div *ngIf="isLoading" class="spinner"></div>
    </button>
</div>

<form id="payment-form" class="hidden">
    <h3>Suscripción a Gramola por {{precio}}€</h3>
    
    <div id="card-element"></div>

    <button id="submit" disabled>
        <div class="spinner hidden" id="spinner"></div>
        <span id="button-text">Pagar</span>
    </button>

    <p id="factura-text"> Las mujeres ya no lloran, las mujeres facturan </p>
    
    <p id="card-error" role="alert"></p>
    
    <p id="success-message" class="result-message hidden">
        ¡Pago realizado con éxito! Redirigiendo...
    </p>
</form>
</div>
